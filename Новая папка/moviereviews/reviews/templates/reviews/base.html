{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Movie Reviews{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Arial', sans-serif;
        }

        .navbar {
            background-color: #1f1f1f;
            padding: 10px 50px;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #e50914;
        }

        .nav-right {
            margin-left: auto;
        }

        .container-content {
            padding: 20px 50px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Netflix-style cards */
        .movies-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .movie-card {
            width: 200px;
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
            text-align: center;
            color: #fff;
        }

        .movie-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .movie-meta {
            font-size: 14px;
            color: #ccc;
        }

        /* Отзывы */
        .review-card {
            background-color: #1f1f1f;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .review-card .favorite-btn {
            background: transparent;
            border: none;
            color: #e50914;
            cursor: pointer;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <nav class="navbar d-flex align-items-center">
        <a href="{% url 'home' %}" class="navbar-brand">Movie Reviews</a>
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'film_list' %}">Фильмы</a>
        <div class="nav-right d-flex align-items-center">
            {% if user.is_authenticated %}
            <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Выход</a>
            {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Войти</a>
            <a href="{% url 'register' %}" class="btn btn-outline-light btn-sm">Регистрация</a>
            {% endif %}
        </div>
    </nav>

    <div class="container-content">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
