<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>

    <style>
        body {
            background: #111;
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-box {
            background: #1c1c1c;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            margin-top: 10px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: none;
            background: #333;
            color: #fff;
        }

        input:focus {
            outline: none;
            background: #444;
        }

        .show-pass {
            margin-top: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #e50914;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #e50914;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #f40612;
        }

        .login-link {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link a {
            color: #e50914;
            text-decoration: none;
        }

        .errorlist {
            color: #ff6b6b;
            font-size: 13px;
            list-style: none;
            padding-left: 0;
        }
    </style>
</head>

<body>

    <div class="auth-box">
        <h2>Регистрация</h2>

        <form method="post">
            {% csrf_token %}

            <label>Никнейм</label>
            {{ form.nickname }}

            <label>Email</label>
            {{ form.email }}

            <label>Пароль</label>
            {{ form.password1 }}

            <label>Повторите пароль</label>
            {{ form.password2 }}

            <div class="show-pass" onclick="togglePassword()">👁 Показать пароль</div>

            <button type="submit">Зарегистрироваться</button>
        </form>

        <div class="login-link">
            Уже есть аккаунт?
            <a href="{% url 'login' %}">Войти</a>
        </div>

        {% if form.errors %}
        <ul class="errorlist">
            {% for field in form %}
            {% for error in field.errors %}
            <li>{{ error }}</li>
            {% endfor %}
            {% endfor %}
        </ul>
        {% endif %}
    </div>

    <script>
        function togglePassword() {
            const pass1 = document.getElementById("id_password1");
            const pass2 = document.getElementById("id_password2");

            const type = pass1.type === "password" ? "text" : "password";
            pass1.type = type;
            pass2.type = type;
        }
    </script>

</body>

</html>
