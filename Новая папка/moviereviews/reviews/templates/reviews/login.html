<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            background: #1c1c1c;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #ff5500;
            color: white;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            border: none;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .show {
            cursor: pointer;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <form method="post">
        {% csrf_token %}
        <h2>Вход</h2>

        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" id="pass" placeholder="Пароль" required>

        <span class="show" onclick="toggle()">👁 Показать пароль</span>

        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <button type="submit">Войти</button>
    </form>

    <script>
        function toggle() {
            let p = document.getElementById("pass");
            p.type = p.type === "password" ? "text" : "password";
        }
    </script>

</body>

</html>
